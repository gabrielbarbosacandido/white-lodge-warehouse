[project]
name = "white-lodge"
version = "0.1.0"
description = "Pharmacy events mini-warehouse for White Lodge Savings"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dlt[duckdb]>=1.6",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "requests>=2.32",
]

[project.scripts]
wl = "white_lodge.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/white_lodge"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
